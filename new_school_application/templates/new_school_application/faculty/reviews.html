{% extends "cis/logged-base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block body %}
<main>
  <h1 class="h3 mb-4 text-gray-800">{{ page_title }}</h1>
  <div class="bg-white border p-3">
    <table id="tbl_reviews" class="table table-striped responsive" style="width:100%"
           data-server-side="true" data-ajax="{{ api_url }}?format=datatables">
      <thead><tr>
        <th data-data="created_on" data-name="created_on">Requested</th>
        <th data-data="highschool" data-name="highschool">High School</th>
        <th data-data="course" data-name="course">Course</th>
        <th data-data="status" data-name="status">Status</th>
        <th data-data="id" data-name="id"><span class="sr-only">Action</span></th>
      </tr></thead>
    </table>
  </div>

  <div class="modal fade" id="reviewModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form id="frm_review" method="post" action="{% url 'new_school_application_faculty:submit_review' %}">
      {% csrf_token %}
      <input type="hidden" name="action" value="submit_review">
      <input type="hidden" name="application_course_review_id" id="rev_id">
      <div class="modal-header"><h5 class="modal-title">Submit Review</h5></div>
      <div class="modal-body">
        <div class="form-group">
          <label>Decision</label>
          <select name="decision" class="form-control">
            <option value="Approved">Approved</option>
            <option value="Approved and Waitlisted">Approved and Waitlisted</option>
            <option value="Not Approved">Not Approved</option>
            <option value="Need more information">Need more information</option>
          </select>
        </div>
        <div class="form-group">
          <label>Comment</label>
          <textarea name="comment" class="form-control"></textarea>
        </div>
      </div>
      <div class="modal-footer"><button type="submit" class="btn btn-primary">Submit</button></div>
    </form>
  </div></div></div>

  <script>
    $(function () {
      $('#tbl_reviews').DataTable({
        order: [[0, 'desc']],
        columns: [
          null, null, null, { searchable: false },
          { searchable: false, orderable: false, render: function (d) {
              return "<button class='btn btn-sm btn-primary review-btn' data-id='" + d + "'>Review</button>"; } }
        ]
      });
      $('#tbl_reviews').on('click', '.review-btn', function () {
        $('#rev_id').val($(this).data('id'));
        $('#reviewModal').modal('show');
      });
      $('#frm_review').on('submit', function (e) {
        e.preventDefault();
        $.post($(this).attr('action'), $(this).serialize(), function () { window.location.reload(); });
      });
    });
  </script>
</main>
{% endblock %}
